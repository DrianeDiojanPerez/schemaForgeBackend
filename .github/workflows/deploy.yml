name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# A second push waits for the first deploy rather than racing it onto the
# same machine.
concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      database:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: schemaforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Without this the postgres suite skips itself and still reports green.
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/schemaforge

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test --all-targets

  deploy:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
