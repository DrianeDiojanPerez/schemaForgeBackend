[package]
name = "schemaforge_backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "SchemaForgeBackend"
publish = false

[[bin]]
name = "server"
path = "src/main.rs"

# `#[async_trait]` writes `#[must_use]` onto methods that already return a
# boxed future, which is must-use on its own. Every hit comes from the macro
# rather than from code anyone here wrote.
[lints.clippy]
double_must_use = "allow"

[dependencies]
# http server
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "trace",
    "request-id",
    "util",
    "cors",
    "normalize-path",
    "sensitive-headers",
] }

# tracing / logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# persistence
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "macros",
    "migrate",
] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"

# domain helpers
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
validator = { version = "0.20", features = ["derive"] }

# security
jsonwebtoken = "9"
bcrypt = "0.17"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"

# mail
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "tokio1",
] }

# outbound http
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
] }
base64 = "0.22"

# grpc
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tonic-reflection = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
http-body = "1"
http-body-util = "0.1"
bytes = "1"

# misc
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-stream = { version = "0.1", features = ["net"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
