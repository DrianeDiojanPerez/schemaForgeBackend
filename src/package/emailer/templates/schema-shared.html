<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schema Shared</title>
</head>

<body style="margin: 0; padding: 0; background-color: #fafafa; font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #fafafa; background-image: radial-gradient(#d4d4d8 1px, transparent 1px); background-size: 16px 16px;">
        <tr>
            <td align="center" style="padding: 48px 16px;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width: 400px; background-color: #ffffff; border: 1px solid #e4e4e7; border-radius: 14px;">
                    <tr>
                        <td align="center" style="padding: 36px 28px 0 28px;">
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                                <tr>
                                    <td style="width: 44px; height: 44px; background-color: #f4f4f5; border: 1px solid #e4e4e7; border-radius: 22px; text-align: center; vertical-align: middle; color: #52525b; font-size: 14px; font-weight: 600; line-height: 44px;">{{avatar}}</td>
                                    <td style="padding: 0 12px; vertical-align: middle;">
                                        <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                                            <tr>
                                                <td style="width: 3px; height: 3px; background-color: #a1a1aa; border-radius: 2px; font-size: 0; line-height: 0;">&nbsp;</td><td style="width: 5px; font-size: 0; line-height: 0;">&nbsp;</td><td style="width: 3px; height: 3px; background-color: #a1a1aa; border-radius: 2px; font-size: 0; line-height: 0;">&nbsp;</td><td style="width: 5px; font-size: 0; line-height: 0;">&nbsp;</td><td style="width: 3px; height: 3px; background-color: #a1a1aa; border-radius: 2px; font-size: 0; line-height: 0;">&nbsp;</td>
                                            </tr>
                                        </table>
                                    </td>
                                    <td style="width: 44px; height: 44px; background-color: #009869; border-radius: 10px; vertical-align: middle;"><img src="https://raw.githubusercontent.com/DrianeDiojanPerez/schemaForgeBackend/master/assets/logo.png" width="44" height="44" alt="S" style="display: block; width: 44px; height: 44px; border-radius: 10px; color: #ffffff; font-size: 24px; font-weight: 700; line-height: 44px; text-align: center;"></td>
                                </tr>
                            </table>
                            <h1 style="margin: 18px 0 6px 0; color: #18181b; font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -0.01em;">{{inviter}} shared a schema with you</h1>
                            <p style="margin: 0; color: #71717a; font-size: 14px; line-height: 22px;">You can now {{verb}} <strong style="color: #18181b;">{{schemaName}}</strong>. It is waiting under Shared with me.</p>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding: 22px 28px 0 28px;">
                            <a href="{{appURI}}" style="display: block; background-color: #009869; color: #ffffff; font-size: 15px; font-weight: 600; text-decoration: none; padding: 12px 20px; border-radius: 10px; text-align: center;">Open</a>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 16px 28px 32px 28px;">
                            <p style="margin: 0; color: #a1a1aa; font-size: 12px; line-height: 18px; text-align: center;">Sign in with this address to see it.</p>
                            <p style="margin: 8px 0 0 0; font-size: 12px; line-height: 18px; text-align: center; word-break: break-all;"><a href="{{appURI}}" style="color: #009869; text-decoration: none;">{{appURI}}</a></p>
                        </td>
                    </tr>
                </table>
                <p style="margin: 24px 0 0 0; color: #a1a1aa; font-size: 12px; line-height: 18px; text-align: center;">SchemaForge &middot; This is an automated message, please do not reply.</p>
            </td>
        </tr>
    </table>
</body>

</html>
