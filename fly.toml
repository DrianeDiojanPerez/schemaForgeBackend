app = "schemaforge-api"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"
  build-target = "production"

[env]
  APP_NAME = "SchemaForgeBackend"
  APP_ENVIRONMENT = "production"
  APP_TIMEZONE = "America/Belize"
  APP_PORT = "3000"
  GRPC_PORT = "50051"
  DB_PORT = "5432"
  DB_SSL_MODE = "require"
  DB_MAX_CONNECTIONS = "10"
  DB_RUN_MIGRATIONS = "true"
  MAIL_FROM_ADDRESS = "noreply@schemaforge.app"
  MAIL_FROM_NAME = "SchemaForge"
  SUPER_ROLE = "Admin"
  LOGGER_LEVEL = "info"
  LOGGER_DIRECTORY = "/app/storage/logs"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/v1/healthcheck"

[[services]]
  protocol = "tcp"
  internal_port = 50051
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 50051

[mounts]
  source = "schemaforge_logs"
  destination = "/app/storage/logs"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
