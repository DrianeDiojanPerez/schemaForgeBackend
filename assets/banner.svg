<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1.6" fill="#c7c7cc"/>
    </pattern>
    <linearGradient id="fade" x1="560" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.75" stop-color="#fff"/>
    </linearGradient>
    <mask id="canvas">
      <rect x="560" y="0" width="720" height="360" fill="url(#fade)"/>
    </mask>
    <clipPath id="card">
      <rect width="1280" height="360" rx="28"/>
    </clipPath>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="2.5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="#f5f5f7"/>
  <g clip-path="url(#card)">
    <rect x="560" y="0" width="720" height="360" fill="url(#dots)" mask="url(#canvas)"/>
  </g>

  <g font-family="'Adwaita Sans', 'Inter', 'Helvetica Neue', sans-serif">
    <text x="92" y="176" font-weight="700" font-size="88" letter-spacing="-3.5" fill="#1d1d1f">schemaforge</text>
    <text x="96" y="224" font-weight="500" font-size="23" letter-spacing="-0.3" fill="#6e6e73">The API behind the schema designer.</text>
    <text x="96" y="258" font-weight="500" font-size="19" letter-spacing="0" fill="#86868b">JSON and gRPC over one Rust service.</text>
  </g>

  <g transform="translate(980 76) scale(3.25)" filter="url(#lift)">
    <rect width="64" height="64" rx="14" fill="#009869"/>
    <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M42 17H29a7.5 7.5 0 0 0 0 15h6a7.5 7.5 0 0 1 0 15H24"/>
      <path d="M24 47l-9-8M24 47h-10M24 47l-9 8"/>
    </g>
    <circle cx="45" cy="17" r="5.5" fill="#fff"/>
  </g>
</svg>
